name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      # Active Record encryption keys for the test environment, injected through env vars rather
      # than written to any on-disk file other than config/environments/test.rb (production takes
      # the same path, see config/application.rb). These are test keys that differ from the test.rb
      # fallback values, to confirm CI actually goes through the env vars and doesn't just happen to
      # hit the test.rb defaults.
      AR_ENCRYPTION_PRIMARY_KEY: fg3Sakd53Ge6haQD8cKen2y164HeL5Kb
      AR_ENCRYPTION_DETERMINISTIC_KEY: jNRHBmNhsjiebbByWNI7oWfubnXilpfe
      AR_ENCRYPTION_KEY_DERIVATION_SALT: n8pz8pGz2OlSJQWZyBmL7IoqDTLjkqtk
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: 修复测试密钥权限
        # git only preserves the executable bit, not other permission bits: a freshly checked-out
        # id_ed25519 is 644, and the OpenSSH client refuses to load a private key with 644
        # ("UNPROTECTED PRIVATE KEY FILE"). It must be changed back to 600 before any ssh call.
        run: chmod 600 test/fake_host/id_ed25519
      - name: 启动 fake host
        run: docker compose -f docker-compose.test.yml up -d --build
      - name: 等待 fake host 就绪
        # Wait for both 2201 (node-1) and 2202 (node-2): probing only 2201 would, when
        # node-2 is slow to start, make the first test that touches it fail with a misleading
        # "FakeHost::NotReady: start docker compose first" error
        # (see final review triage 4).
        run: |
          for port in 2201 2202; do
            for i in $(seq 1 60); do
              if ssh -i test/fake_host/id_ed25519 -o StrictHostKeyChecking=no \
                     -o UserKnownHostsFile=/dev/null -p "$port" deploy@127.0.0.1 \
                     'docker info' >/dev/null 2>&1; then
                echo "port $port ready"; break
              fi
              if [ "$i" -eq 60 ]; then
                echo "fake host（端口 $port）启动超时"; exit 1
              fi
              sleep 2
            done
          done
      # config/deploy.yml in the repo is a sample meant to be copied by people. Parse it with the
      # panel's own parser: this takes the same code path as the panel handling a user-pasted
      # deploy.yml, so if it breaks or a Kamal upgrade stops accepting it, we find out before our
      # readers do. Connects to no hosts.
      - name: 校验仓库内的 deploy.yml
        run: bin/rails deploy_config:verify

      - name: 单元测试 + 浏览器测试
        # By Rails convention bin/rails test does not include test/system. That once meant this
        # product's only browser-level honest assertion (an unreachable host still shows its last
        # known status) never ran in CI even once (see final review I5). test:all runs both.
        run: bin/rails test:all

  # Kamal version compatibility matrix (main design §9.4).
  #
  # The panel requires the kamal gem directly and relies on its internal behavior in four places:
  # config parsing, container labels, lock directory format, and CLI arguments. This is the
  # unavoidable cost of that approach and must surface automatically in CI, rather than waiting for
  # users to report "the panel is totally broken after upgrading Kamal".
  #
  # The currently pinned version (2.12) is covered by the test job above; this one only runs the
  # previous minor.
  compat_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kamal: [ "2.11.0" ]
    env:
      KAMAL_VERSION: "~> ${{ matrix.kamal }}"
      AR_ENCRYPTION_PRIMARY_KEY: fg3Sakd53Ge6haQD8cKen2y164HeL5Kb
      AR_ENCRYPTION_DETERMINISTIC_KEY: jNRHBmNhsjiebbByWNI7oWfubnXilpfe
      AR_ENCRYPTION_KEY_DERIVATION_SALT: n8pz8pGz2OlSJQWZyBmL7IoqDTLjkqtk
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # No bundler-cache: Gemfile.lock pins 2.12, and this job deliberately makes
          # bundler re-resolve to a different version, so a cache would only get in the way.
          bundler-cache: false
      - name: 安装被测版本的依赖
        run: bundle install --jobs 4

      # This step is NOT allowed to fail, and it must run before the tests.
      #
      # If KAMAL_VERSION ever stops working (renamed, misspelled, bundler behavior change), the
      # matrix would silently run 2.12 again and show green forever; a job that tests nothing yet
      # always passes is worse than no job at all. So first pin down that "what I'm running is
      # really that version".
      - name: 确认真的装上了被测版本
        run: |
          actual=$(bundle exec ruby -e 'require "kamal/version"; print Kamal::VERSION')
          echo "期望 ${{ matrix.kamal }}，实际 $actual"
          if [ "$actual" != "${{ matrix.kamal }}" ]; then
            echo "::error::矩阵没有生效：期望 kamal ${{ matrix.kamal }}，实际装的是 $actual"
            exit 1
          fi

      - name: 修复测试密钥权限
        run: chmod 600 test/fake_host/id_ed25519
      - name: 启动 fake host
        run: docker compose -f docker-compose.test.yml up -d --build
      - name: 等待 fake host 就绪
        run: |
          for port in 2201 2202; do
            for i in $(seq 1 60); do
              if ssh -i test/fake_host/id_ed25519 -o StrictHostKeyChecking=no \
                     -o UserKnownHostsFile=/dev/null -p "$port" deploy@127.0.0.1 \
                     'docker info' >/dev/null 2>&1; then
                echo "port $port ready"; break
              fi
              if [ "$i" -eq 60 ]; then
                echo "fake host（端口 $port）启动超时"; exit 1
              fi
              sleep 2
            done
          done

      # This step IS allowed to fail: incompatibility on an older version is information to be seen,
      # not a merge gate. The difference from the assertion step above is deliberate: a broken
      # matrix must be loud, while an incompatible version under test only needs to be visible.
      - name: 跑全套（旧版本不兼容不阻塞合并）
        id: compat_tests
        continue-on-error: true
        run: bin/rails test:all

      - name: 把结果写进作业摘要
        if: always()
        run: |
          if [ "${{ steps.compat_tests.outcome }}" = "success" ]; then
            echo "✅ kamal ${{ matrix.kamal }}：全套通过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ kamal ${{ matrix.kamal }}：测试未通过（不阻塞合并，但需要有人看一眼）" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "面板依赖 Kamal 的内部行为，这条红意味着升级/降级到该版本会出问题。" >> "$GITHUB_STEP_SUMMARY"
            echo "详情见本作业的「跑全套」步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
