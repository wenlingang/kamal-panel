      no_destination: 还没有备份存储，需要管理员在「设置」里添加。
      none: 尚未备份：%{accessories}。
      default_database: 默认库
      keep:
        other: 保留 %{count} 份
      paused: 已暂停
      run_now: 立即备份
      delete: 移除
      delete_confirm: 不再备份 %{accessory}？存储里已有的备份文件会保留。
      last_failed: 最近一次备份失败（%{time}）。
      first_run: 第一次备份大约在 %{time} 开始。
      never_run: 还没有备份记录。
      started: 开始时间
      result: 结果
      size: 大小
      by: 发起
      scheduled: 定时
      download: 下载
