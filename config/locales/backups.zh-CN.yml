      interrupted: 备份进行中面板重启了，这次没有完成。

  backup_destinations:
    index:
      title: 备份存储
      subtitle: 存放 accessory 数据库备份的 S3 兼容存储桶（AWS S3、Cloudflare R2、MinIO、阿里云 OSS、Backblaze B2 等）。
      add: 添加存储
      empty: 还没有备份存储。先添加一个存储桶，再到应用的「备份」页设置备份。
      name: 名字
      location: 位置
      used_by: 使用者
      unused: 暂未使用
      last_check: 最近检查
      check_ok_at: "%{time} 检查通过"
      check_failed_at: "%{time} 检查失败"
      never: 还没检查过
      check: 检查
      delete: 删除
      delete_confirm: 删除备份存储 %{name}？存储桶里已有的备份文件会保留。
    new:
      title: 添加备份存储
      subtitle: 面板会把备份上传到这里，并删除超出保留份数的旧备份，所以密钥需要有前缀下对象的写入、读取和删除权限。
    form:
      name: 名字
      endpoint: 访问地址
      endpoint_hint: "存储的 S3 API 地址，例如 https://s3.ap-northeast-1.amazonaws.com、https://<account>.r2.cloudflarestorage.com 或 https://oss-cn-hangzhou.aliyuncs.com。"
      bucket: 存储桶
      region: 区域
      region_hint: 不区分区域的存储填 us-east-1；Cloudflare R2 填 auto。
      prefix: 前缀
      prefix_hint: 可选，存储桶里的目录。备份会放在 前缀/应用/accessory/ 下。
      path_style: 路径风格地址（endpoint/bucket/key）
      path_style_hint: MinIO、R2 和大多数自建存储保持勾选。AWS 推荐、阿里云 OSS 要求的是虚拟主机风格（bucket.endpoint/key），这时取消勾选。
      access_key_id: Access Key ID
      secret_access_key: Secret Access Key
      secret_hint: 加密保存，之后不再显示。
      secret_keep: 留空则保持不变。
      save_and_check: 保存并检查
      cancel: 取消

  backup_plans:
    engines:
      postgres: PostgreSQL
      mysql: MySQL / MariaDB
    every:
      other: 每 %{count} 小时
    states:
      running: 进行中
      succeeded: 完成
      failed: 失败
    new:
      title: 备份 %{name} 的数据库
      back: "%{name} · 备份"
