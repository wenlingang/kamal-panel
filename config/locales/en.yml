      kamal_secrets: .kamal/secrets contents (optional)
      kamal_secrets_hint: The contents of your project's .kamal/secrets file, for per-app things like RAILS_MASTER_KEY. Use the dropdown above for the registry password instead of repeating it here.
      kamal_secrets_blank_warning: 'If you leave it empty: any variable referenced in deploy.yml that the registry credential above does not supply will make kamal fail with "Secret not found" during app boot / rollback.'
      kamal_hooks: .kamal/hooks scripts (optional, JSON)
