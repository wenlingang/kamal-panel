      config_section: Config files
      config_yaml: deploy.yml
      destination_config_yaml: deploy.<destination>.yml (optional)
      destination_config_hint: Only needed if you use a destination. Leaving it empty loses that destination's overrides for servers and the like (for example staging and production running on different machines).
