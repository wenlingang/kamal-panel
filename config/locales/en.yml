# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # 界面主语言是中文；这份英文是 i18n.fallbacks 的落点，也是将来做双语切换
  # 时的起点。属性名在这里给全，否则 app.update 的字段名会退化成 Rails
  # 自动 humanize 出来的 "Ssh credential id"。
  activerecord:
    errors:
      models:
        credential:
          attributes:
            value:
              too_long: is too large to parse and was rejected
              encrypted: 'must be an SSH private key without a passphrase: the panel opens SSH connections unattended, with nobody present to type one'
              not_a_private_key: is not a usable SSH private key
        registry_credential:
          attributes:
            value:
              no_quotes_or_newlines: 'cannot contain a single quote or a newline: the password is written into a single-quoted value in .kamal/secrets-common, and that form has no way to escape either character'
        managed_app:
          attributes:
            destination:
              invalid_format: must be a short identifier (letters, digits, underscores, hyphens, at most 63 characters) with no path separators or dots — a destination is not a path
            config_yaml:
              unparseable: 'cannot be parsed: %{reason}'
            ssh_credential:
              invalid_key: 'SSH key: %{reason}'
            kamal_hooks:
              unknown_hooks: 'contains hook names Kamal does not know: %{names}'
              hook_not_a_string: the value of each hook must be the text of the script
              not_a_json_object: 'must be a JSON object, like {"pre-connect": "#!/bin/sh\n..."}'
            kamal_secrets:
              registry_secret_collision: already defines %{env}, which also comes from the selected registry credential. Remove one of them — with both in place the deploy quietly uses the wrong password.
    attributes:
      managed_app:
        name: Name
        destination: Destination
        config_yaml: deploy.yml
        destination_config_yaml: deploy.<destination>.yml
        ssh_credential: SSH key
        registry_credential: Registry password
        kamal_secrets: .kamal/secrets
        kamal_hooks: .kamal/hooks

  # 角色的英文显示名。代码里的角色值仍是 admin/developer/ops，这里只是
  # 给界面看的——zh-CN 那边早就有，en 这边一直缺，是 LocaleSmokeTest 头一次
  # 跑就抓出来的。
  roles:
    admin: Admin
    developer: Developer
    ops: Ops

  common:
    save: Save
    replace: Replace
    error_separator: "; "
    list_separator: ", "

