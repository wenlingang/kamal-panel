# 这里只放本仓库自己需要的译文。time_ago_in_words、"不能为空"这类
# Rails 自带文案由 rails-i18n 提供，不要在这里重抄一遍——抄一份就多一份
# 会悄悄和上游漂移的东西。
zh-CN:
  # rails-i18n 的 blank 译作"不能为空字符"，在中文界面里读起来别扭；
  # 只覆盖这一条，其余仍用上游译文。
  errors:
    messages:
      blank: 不能为空

  # 校验失败时 full_messages 会把属性名拼在最前面。不给译名的话，
  # 中文的报错正文前面会挂一个英文列名（"Config yaml 无法解析：…"）。
  activerecord:
    errors:
      models:
        credential:
          attributes:
            value:
              too_long: 私钥内容过长，已拒绝解析
              encrypted: "必须是不带密码的 SSH 私钥：面板需要无人值守地建立 SSH 连接，没有人能在场输入密码"
              not_a_private_key: 不是可用的 SSH 私钥
        registry_credential:
          attributes:
            value:
              no_quotes_or_newlines: "不能包含单引号或换行：密码要写进 .kamal/secrets-common 的单引号值里，而那种写法对这两个字符没有转义办法"
        managed_app:
          attributes:
            destination:
              invalid_format: 只能是简短的标识符（字母、数字、下划线、连字符，最多 63 个字符），不能包含路径分隔符或点——destination 不是路径
            config_yaml:
              unparseable: "无法解析：%{reason}"
            ssh_credential:
              invalid_key: "SSH 私钥：%{reason}"
            kamal_hooks:
              unknown_hooks: "包含 Kamal 不认识的 hook 名：%{names}"
              hook_not_a_string: 每个 hook 的内容必须是脚本文本
              not_a_json_object: '必须是 JSON 对象，形如 {"pre-connect": "#!/bin/sh\n..."}'
            kamal_secrets:
              registry_secret_collision: 里已经定义了 %{env}，而它同时来自选中的 registry 凭据。删掉其中一处——两处都在时，部署会安静地用错一个密码。
    models:
      managed_app: 应用
      user: 用户
      credential: 凭据
    attributes:
      managed_app:
        name: 名称
        destination: Destination
        config_yaml: deploy.yml 原文
        destination_config_yaml: deploy.<destination>.yml 原文
        ssh_credential: SSH 私钥
        registry_credential: registry 密码
        kamal_secrets: .kamal/secrets 内容
        kamal_hooks: .kamal/hooks 内容
      user:
        email_address: 邮箱地址
        nickname: 昵称
        password: 密码
        password_confirmation: 重复密码
        role: 角色
      credential:
        value: 内容
        kind: 类型

  # 角色的中文显示名。人员页与新建/编辑表单都用它，代码里的角色值仍是
  # admin/developer/ops。
  roles:
    admin: 超管
    developer: 开发者
    ops: 运维

  # 审计页的动作与对象。动作名和 detail_key 都只是【键】，中文只活在这里
  # ——审计行是只增不删的，往里写中文就等于把语言永久焊死在数据里。
  common:
    save: 保存
    replace: 替换
    error_separator: "；"
    list_separator: "、"
    # 枚举的连接符。中文用顿号、英文用逗号加空格，所以它也得是译文。
    # 审计页也用它——原先在 audit.list_separator 下另有一份，两份同值的译文
    # 迟早会漂开，合并到这里。

