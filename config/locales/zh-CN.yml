# Only translations this repo itself needs go here. Rails' built-in strings such as
# time_ago_in_words and "can't be blank" come from rails-i18n; don't copy them here again, since
# every copy is one more thing that silently drifts from upstream.
zh-CN:
# rails-i18n translates blank as "不能为空字符", which reads awkwardly in a Chinese UI;
# override only this one and keep upstream translations for the rest.
  errors:
    messages:
      blank: 不能为空

  # rails-i18n glues numbers to Chinese units ("22天前", "大约1个月前") while the rest of this UI
  # spaces them ("1 台机器", "最近 50 次"), so the units read as a different typeface. Same exemption
  # as blank above: override only the counted phrases, keep upstream for the rest.
  datetime:
    distance_in_words:
      about_x_hours: 约 %{count} 小时
      about_x_months: 约 %{count} 个月
      about_x_years: 约 %{count} 年
      almost_x_years: 接近 %{count} 年
      less_than_x_seconds: 不到 %{count} 秒
      less_than_x_minutes: 不到 %{count} 分钟
      over_x_years: "%{count} 年多"
      x_seconds: "%{count} 秒"
      x_minutes: "%{count} 分钟"
      x_days: "%{count} 天"
      x_months: "%{count} 个月"
      x_years: "%{count} 年"

  # One absolute format everywhere a moment is shown in full (audit log, deploy history).
  time:
    formats:
      panel: "%Y-%m-%d %H:%M"
      # Heartbeat tooltips: rounds are seconds apart, so minutes alone would repeat.
      precise: "%Y-%m-%d %H:%M:%S"
      # Log lines: to the millisecond, the date without the year (a query spans at most a day).
      log: "%m-%d %H:%M:%S.%L"
      # Metrics chart read-outs: one sample a minute, a range of up to a week.
      metrics_point: "%m-%d %H:%M"

  # On validation failure, full_messages puts the attribute name first. Without a translated name,
  # Chinese error text would be prefixed with an English column name ("Config yaml 无法解析：…").
  activerecord:
    errors:
      models:
        credential:
          attributes:
            value:
              too_long: 私钥内容过长，已拒绝解析
              encrypted: "必须是不带密码的 SSH 私钥：面板需要无人值守地建立 SSH 连接，没有人能在场输入密码"
              not_a_private_key: 不是可用的 SSH 私钥
        registry_credential:
          attributes:
            value:
              no_quotes_or_newlines: "不能包含单引号或换行：密码要写进 .kamal/secrets-common 的单引号值里，而那种写法对这两个字符没有转义办法"
        managed_app:
          attributes:
            destination:
              invalid_format: 只能是简短的标识符（字母、数字、下划线、连字符，最多 63 个字符），不能包含路径分隔符或点——destination 不是路径
            config_yaml:
              unparseable: "无法解析：%{reason}"
            ssh_credential:
              invalid_key: "SSH 私钥：%{reason}"
            kamal_hooks:
              unknown_hooks: "包含 Kamal 不认识的 hook 名：%{names}"
              hook_not_a_string: 每个 hook 的内容必须是脚本文本
              not_a_json_object: '必须是 JSON 对象，形如 {"pre-connect": "#!/bin/sh\n..."}'
            kamal_secrets:
              registry_secret_collision: 里已经定义了 %{env}，而它同时来自选中的 registry 凭据。删掉其中一处——两处都在时，部署会安静地用错一个密码。
            repository:
              invalid_format: 只能是仓库路径，形如 acme/shop 或 group/subgroup/project
            git_branch:
              invalid_format: 不是合法的分支名
        git_connection:
          attributes:
            token:
              required_with_new_api_url: 改了 API 地址就要重新填写 token——原 token 不会被发往新地址
            api_url:
              not_http: 必须是 http:// 或 https:// 开头的地址
            web_url:
              not_http: 必须是 http:// 或 https:// 开头的地址
    models:
      managed_app: 应用
      user: 用户
      credential: 凭据
    attributes:
      managed_app:
        name: 名称
        destination: Destination
        config_yaml: deploy.yml 原文
        destination_config_yaml: deploy.<destination>.yml 原文
        ssh_credential: SSH 私钥
        registry_credential: registry 密码
        kamal_secrets: .kamal/secrets 内容
        kamal_hooks: .kamal/hooks 内容
        git_connection: Git 连接
        repository: 代码仓库
        git_branch: 分支
        version_format: 版本号格式
      user:
        email_address: 邮箱地址
        nickname: 昵称
        password: 密码
        password_confirmation: 重复密码
        role: 角色
      credential:
        value: 内容
        kind: 类型

  # Chinese display names for roles. Used by the people page and the new/edit forms; the role values
  # in code are still admin/developer/ops.
      git_connection:
        name: 名字
        provider: 平台
        api_url: API 地址
        web_url: 网页地址
        token: Token
  roles:
    admin: 超管
    developer: 开发者
    ops: 运维

  # Actions and targets on the audit page. Action names and detail_key are both just [keys]; Chinese
  # lives only here because audit rows are append-only, and writing Chinese into them would weld the
  # language into the data permanently.
  duration:
    ms: "%{count} 毫秒"
    seconds: "%{count} 秒"
    minutes: "%{minutes} 分 %{seconds} 秒"

  common:
    save: 保存
    copy_value: 复制 %{value}
    copied: 已复制
    replace: 替换
    edit: 编辑
    error_separator: "；"
    list_separator: "、"
    # Joiner for enumerations. Chinese uses the ideographic comma (、), English a comma plus space, so it too has to be a
    # translation. The audit page uses it too; there used to be a separate copy under
    # audit.list_separator, and two same-valued translations would sooner or later drift apart, so
    # they are merged here.

