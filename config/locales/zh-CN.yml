      registry_credential_hint_html: 选中之后，面板会按这个应用 deploy.yml 里 <code>registry.password</code> 引用的变量名，把密码写进 .kamal/secrets-common。留空则面板不注入任何 registry 密码，得由下面的 .kamal/secrets 自己提供——两处都提供同一个变量时保存会被拒绝。
