# Configuration the panel uses to deploy itself. This copy in the repo is a [sample]: hostnames,
# domains, and image ownership are all placeholders; fill them in and it works as-is (see README
# "Deploying the panel itself").
#
# ⚠️ Do not add the panel to its own managed-app list. Restarting the panel with the panel kills
#    itself midway through the command: the audit stays at pending forever, streaming output is cut off halfway, and the deploy lock is left on the primary
#    host and must be force-unlocked by hand. The panel deploys itself from a dev machine with the kamal CLI setup below.
service: kamal-panel

# Image ownership on ghcr.io. Replace with your own GitHub username or org name.
image: your-org/kamal-panel

# The panel is [single-node]: data lives in SQLite, and Solid Queue runs inside the Puma process
# (see the env and volumes below). So there can be only one web server here; adding a second does
# not give you a more capable panel, only two panels that each hold half the data and don't know the
# other exists.
servers:
  web:
    - your-server.example.com

# Let's Encrypt issues certificates automatically. With it you must enable config.assume_ssl and
# config.force_ssl in config/environments/production.rb (those two lines are commented out right
# now); otherwise Rails thinks it is on bare HTTP, will generate http:// links, and will let
# insecure cookies through.
proxy:
  ssl: true
  host: panel.example.com

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    # These three are [required] by the panel, not optional: SSH private keys are stored encrypted
    # with Active Record encryption; without them the panel still boots, but saving a private key
    # errors out. That is, you can log in and see the UI but can't onboard any app (this is what the
    # README section "Active Record encryption credentials" is about).
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  clear:
    # Polling and action execution are Solid Queue jobs, running inside the Puma process.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The SQLite database and Active Storage files all live in this volume. **It contains the encrypted
# SSH private keys**; backing it up is equivalent to backing up the access credentials for all your
# servers, so treat it at that level.
volumes:
  - "kamal_panel_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
